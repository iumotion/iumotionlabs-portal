<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="180" height="180" rx="40" fill="url(#bgGradient)"/>

  <!-- Subtle glow -->
  <circle cx="90" cy="90" r="60" fill="url(#iconGradient)" opacity="0.1"/>

  <!-- Logo container -->
  <rect x="40" y="40" width="100" height="100" rx="24" fill="url(#iconGradient)"/>

  <!-- Logo text "iL" -->
  <text x="90" y="105" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="48" font-weight="700" fill="white" text-anchor="middle">iL</text>
</svg>
