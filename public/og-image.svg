<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Main gradient -->
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>

    <!-- Background gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>

    <!-- Glow effects -->
    <radialGradient id="glowViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0"/>
    </radialGradient>

    <radialGradient id="glowEmerald" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:0"/>
    </radialGradient>

    <radialGradient id="glowAmber" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0"/>
    </radialGradient>

    <!-- Project gradients -->
    <linearGradient id="savvyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#14b8a6"/>
    </linearGradient>

    <linearGradient id="mythosGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#ea580c"/>
    </linearGradient>

    <linearGradient id="familyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>

    <!-- Grid pattern -->
    <pattern id="gridPattern" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Grid overlay -->
  <rect width="1200" height="630" fill="url(#gridPattern)"/>

  <!-- Decorative glow orbs -->
  <ellipse cx="900" cy="150" rx="300" ry="250" fill="url(#glowViolet)"/>
  <ellipse cx="200" cy="500" rx="250" ry="200" fill="url(#glowEmerald)"/>
  <ellipse cx="1100" cy="550" rx="200" ry="150" fill="url(#glowAmber)"/>

  <!-- Decorative lines -->
  <line x1="0" y1="200" x2="150" y2="200" stroke="rgba(99,102,241,0.3)" stroke-width="2"/>
  <line x1="1050" y1="430" x2="1200" y2="430" stroke="rgba(139,92,246,0.3)" stroke-width="2"/>

  <!-- Logo container -->
  <g transform="translate(80, 80)">
    <!-- Logo background -->
    <rect width="64" height="64" rx="16" fill="url(#primaryGradient)"/>
    <!-- Logo text "iL" -->
    <text x="32" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="white" text-anchor="middle">iL</text>
  </g>

  <!-- Brand name -->
  <text x="160" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="700" fill="white">IumotionLabs</text>

  <!-- Main headline -->
  <text x="80" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="700" fill="white">Transformamos</text>
  <text x="80" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="700" fill="url(#primaryGradient)">ideas en productos</text>
  <text x="80" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="700" fill="white">de alto impacto</text>

  <!-- Tagline -->
  <text x="80" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="rgba(148,163,184,1)">Laboratorio de innovación digital | Bogotá, Colombia</text>

  <!-- Project cards - Bento style -->
  <!-- SAVVY Card -->
  <g transform="translate(750, 180)">
    <rect width="160" height="120" rx="16" fill="rgba(15,23,42,0.8)" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
    <circle cx="30" cy="35" r="16" fill="url(#savvyGradient)"/>
    <text x="55" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="white">SAVVY</text>
    <text x="20" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="rgba(148,163,184,1)">Finanzas personales</text>
    <rect x="20" y="90" width="60" height="18" rx="9" fill="rgba(16,185,129,0.15)"/>
    <text x="50" y="103" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#10b981" text-anchor="middle">Launchpad</text>
  </g>

  <!-- MYTHOS Card -->
  <g transform="translate(930, 180)">
    <rect width="180" height="120" rx="16" fill="rgba(15,23,42,0.8)" stroke="rgba(245,158,11,0.3)" stroke-width="1"/>
    <circle cx="30" cy="35" r="16" fill="url(#mythosGradient)"/>
    <text x="55" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="white">MYTHOS</text>
    <text x="20" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="rgba(148,163,184,1)">Innovación narrativa</text>
    <rect x="20" y="90" width="50" height="18" rx="9" fill="rgba(245,158,11,0.15)"/>
    <text x="45" y="103" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#f59e0b" text-anchor="middle">Building</text>
  </g>

  <!-- FAMILY CARE Card -->
  <g transform="translate(750, 320)">
    <rect width="360" height="100" rx="16" fill="rgba(15,23,42,0.8)" stroke="rgba(139,92,246,0.3)" stroke-width="1"/>
    <circle cx="35" cy="50" r="20" fill="url(#familyGradient)"/>
    <text x="70" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="white">FAMILY CARE</text>
    <text x="70" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="rgba(148,163,184,1)">Cuidado familiar integral</text>
    <rect x="260" y="35" width="70" height="22" rx="11" fill="rgba(139,92,246,0.15)"/>
    <text x="295" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#8b5cf6" text-anchor="middle">Concept Lab</text>
  </g>

  <!-- Tech stack badges -->
  <g transform="translate(80, 490)">
    <rect width="70" height="28" rx="6" fill="rgba(99,102,241,0.15)" stroke="rgba(99,102,241,0.3)" stroke-width="1"/>
    <text x="35" y="19" font-family="monospace" font-size="12" fill="#818cf8" text-anchor="middle">Flutter</text>
  </g>
  <g transform="translate(160, 490)">
    <rect width="70" height="28" rx="6" fill="rgba(99,102,241,0.15)" stroke="rgba(99,102,241,0.3)" stroke-width="1"/>
    <text x="35" y="19" font-family="monospace" font-size="12" fill="#818cf8" text-anchor="middle">Angular</text>
  </g>
  <g transform="translate(240, 490)">
    <rect width="50" height="28" rx="6" fill="rgba(99,102,241,0.15)" stroke="rgba(99,102,241,0.3)" stroke-width="1"/>
    <text x="25" y="19" font-family="monospace" font-size="12" fill="#818cf8" text-anchor="middle">Go</text>
  </g>
  <g transform="translate(300, 490)">
    <rect width="55" height="28" rx="6" fill="rgba(99,102,241,0.15)" stroke="rgba(99,102,241,0.3)" stroke-width="1"/>
    <text x="27" y="19" font-family="monospace" font-size="12" fill="#818cf8" text-anchor="middle">AWS</text>
  </g>

  <!-- URL -->
  <text x="80" y="570" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500" fill="url(#primaryGradient)">iumotionlabs.com</text>

  <!-- Decorative corner elements -->
  <path d="M1150 0 L1200 0 L1200 50" stroke="url(#primaryGradient)" stroke-width="3" fill="none"/>
  <path d="M0 580 L0 630 L50 630" stroke="url(#primaryGradient)" stroke-width="3" fill="none"/>
</svg>
